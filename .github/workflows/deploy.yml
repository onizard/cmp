name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Le workflow active Pages tout seul (enablement) et publie le site :
# aucun réglage à faire à la main dans les paramètres du dépôt.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Compiler
        run: npm run build

      - name: Préparer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
