map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# --- CORS pour les applis des stores ---
# L'appli web est servie par cette passerelle : même origine que l'API, pas
# de CORS. Les applis Android et iOS, elles, embarquent leurs pages et parlent
# depuis une autre origine (https://localhost sur Android,
# capacitor://localhost sur iPhone). On ouvre l'API à ces deux origines-là,
# et à elles seules : pour toute autre origine, les variables restent vides
# et nginx n'ajoute aucun en-tête.
map $http_origin $cors_origine {
  default                 "";
  "https://localhost"     $http_origin;
  "capacitor://localhost" $http_origin;
}
map $cors_origine $cors_methodes {
  default "";
  "~."    "GET, POST, PUT, PATCH, DELETE, OPTIONS";
}
map $cors_origine $cors_entetes {
  default "";
  "~."    $http_access_control_request_headers;
}
map $cors_origine $cors_expose {
  default "";
  "~."    "Content-Range, Content-Profile, Range-Unit, X-Supabase-Api-Version";
}
map $cors_origine $cors_age {
  default "";
  "~."    "86400";
}

server {
  listen 80;
  server_name _;
  client_max_body_size 10m;

  # Résolveur DNS interne de Docker : les noms de services sont résolus À CHAUD
  # (à chaque requête), pas au démarrage. nginx démarre donc même si un service
  # est momentanément absent, et suit les changements d'IP après un redémarrage.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # --- API Supabase auto-hébergée (même origine que l'app web ; CORS pour
  #     les applis des stores, voir plus haut) ---
  # NB : le `set` DOIT précéder le `rewrite ... break` (le drapeau break stoppe
  # les directives rewrite suivantes, dont le set).

  location /auth/v1/ {
    # CORS des applis : la passerelle répond seule, en-têtes de l'amont
    # masqués pour ne jamais les doubler.
    if ($request_method = OPTIONS) { return 204; }
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    add_header Access-Control-Allow-Origin   $cors_origine  always;
    add_header Access-Control-Allow-Methods  $cors_methodes always;
    add_header Access-Control-Allow-Headers  $cors_entetes  always;
    add_header Access-Control-Expose-Headers $cors_expose   always;
    add_header Access-Control-Max-Age        $cors_age      always;
    add_header Vary Origin always;
    set $up_auth http://auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $up_auth;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /rest/v1/ {
    # CORS des applis : la passerelle répond seule, en-têtes de l'amont
    # masqués pour ne jamais les doubler.
    if ($request_method = OPTIONS) { return 204; }
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    add_header Access-Control-Allow-Origin   $cors_origine  always;
    add_header Access-Control-Allow-Methods  $cors_methodes always;
    add_header Access-Control-Allow-Headers  $cors_entetes  always;
    add_header Access-Control-Expose-Headers $cors_expose   always;
    add_header Access-Control-Max-Age        $cors_age      always;
    add_header Vary Origin always;
    set $up_rest http://rest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $up_rest;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /realtime/v1/ {
    set $up_rt http://realtime:4000;
    rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
    proxy_pass $up_rt;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Realtime lit son « locataire » dans le premier mot du nom d'hôte : il
    # attend « realtime-dev » (celui qu'il crée au démarrage). Avec le nom
    # public (cmp.break-pharma.fr → « cmp »), il refusait toute connexion.
    proxy_set_header Host realtime-dev.cmp-realtime;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- L'application elle-même (fichiers statiques compilés) ---

  # Ces fichiers pilotent les mises à jour : ils ne doivent JAMAIS être mis en
  # cache, ni par le navigateur ni par Cloudflare. Sinon l'appli reste bloquée
  # sur une ancienne version.
  location = /sw.js              { root /usr/share/nginx/html; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /registerSW.js      { root /usr/share/nginx/html; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /push-sw.js         { root /usr/share/nginx/html; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /manifest.webmanifest { root /usr/share/nginx/html; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /index.html         { root /usr/share/nginx/html; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }

  # Les fichiers versionnés (nom unique à chaque build) peuvent être gardés
  # longtemps sans risque.
  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
