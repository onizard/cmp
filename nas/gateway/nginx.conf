map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 10m;

  # Résolveur DNS interne de Docker : les noms de services sont résolus À CHAUD
  # (à chaque requête), pas au démarrage. nginx démarre donc même si un service
  # est momentanément absent, et suit les changements d'IP après un redémarrage.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # --- API Supabase auto-hébergée (même origine que l'app : pas de CORS) ---
  # NB : le `set` DOIT précéder le `rewrite ... break` (le drapeau break stoppe
  # les directives rewrite suivantes, dont le set).

  location /auth/v1/ {
    set $up_auth http://auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $up_auth;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /rest/v1/ {
    set $up_rest http://rest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $up_rest;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /realtime/v1/ {
    set $up_rt http://realtime:4000;
    rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
    proxy_pass $up_rt;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- L'application elle-même (fichiers statiques compilés) ---

  # Ces fichiers pilotent les mises à jour : ils ne doivent JAMAIS être mis en
  # cache, ni par le navigateur ni par Cloudflare. Sinon l'appli reste bloquée
  # sur une ancienne version.
  location = /sw.js              { root /usr/share/nginx/html; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /registerSW.js      { root /usr/share/nginx/html; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /push-sw.js         { root /usr/share/nginx/html; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /manifest.webmanifest { root /usr/share/nginx/html; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /index.html         { root /usr/share/nginx/html; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }

  # Les fichiers versionnés (nom unique à chaque build) peuvent être gardés
  # longtemps sans risque.
  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    root /usr/share/nginx/html;
    # Pas de `$uri/` ici : une demande de « / » trouverait le dossier, nginx
    # servirait son index depuis CE bloc, et le « no-cache » pose plus haut sur
    # /index.html ne s'appliquerait jamais — la page resterait en cache chez le
    # visiteur alors meme qu'on croit l'avoir interdit. Sans `$uri/`, « / »
    # retombe sur /index.html par redirection interne, qui elle repasse par les
    # blocs `location` et recoit bien l'en-tete.
    try_files $uri /index.html;
  }
}
