map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 10m;

  # Résolveur DNS interne de Docker : les noms de services sont résolus À CHAUD
  # (à chaque requête), pas au démarrage. nginx démarre donc même si un service
  # est momentanément absent, et suit les changements d'IP après un redémarrage.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # --- API Supabase auto-hébergée (même origine que l'app : pas de CORS) ---
  # NB : le `set` DOIT précéder le `rewrite ... break` (le drapeau break stoppe
  # les directives rewrite suivantes, dont le set).

  location /auth/v1/ {
    set $up_auth http://auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $up_auth;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /rest/v1/ {
    set $up_rest http://rest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $up_rest;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /realtime/v1/ {
    set $up_rt http://realtime:4000;
    rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
    proxy_pass $up_rt;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- L'application elle-même (fichiers statiques compilés) ---

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
